name: Deploy CrunchyDB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy-crunchydb:
    name: Deploy CrunchyDB
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Set up OpenShift CLI
        uses: redhat-actions/oc-installer@v1

      - name: Login to OpenShift
        run: |
          oc login ${{ secrets.OC_SERVER }} --token=${{ secrets.OC_TOKEN }} --insecure-skip-tls-verify=true

      - name: Deploy CrunchyDB
        run: |
          helm upgrade --install notify-db ./crunchydb -f ./crunchydb/values-${{ github.ref_name }}.yaml -n ${{ secrets.OC_NAMESPACE }}
